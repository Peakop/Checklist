<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stealth Trade Doc Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Sarabun:wght@400;600;700&display=swap">
<style>
/* Layout: two-pane inspection workbench. Document index on the left, the inspection sheet on the right, sticky score strip on top of the sheet. */
:root{
  --paper:#EDF0F4; --sheet:#FFFFFF; --ink:#17202D; --muted:#5A6577; --faint:#8A94A3;
  --line:#DAE0E8; --line-strong:#BCC5D2;
  --accent:#1D4E9E; --accent-ink:#FFFFFF; --accent-soft:#E4EBF7;
  --pass:#17794A; --pass-soft:#E1F1E8; --fail:#BE3A2E; --fail-soft:#FBEAE7;
  --warn:#94600A; --warn-soft:#FAF0D9; --na:#677080; --na-soft:#E9ECF0;
  --f-ui:"IBM Plex Sans Thai","Noto Sans Thai","Leelawadee UI",system-ui,sans-serif;
  --f-doc:"Sarabun","Noto Sans Thai",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px; --r-sm:7px;
  --shadow:0 1px 2px rgba(23,32,45,.06),0 4px 14px rgba(23,32,45,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E131A; --sheet:#161D27; --ink:#E5EAF1; --muted:#9AA5B5; --faint:#6E7887;
    --line:#273141; --line-strong:#384457;
    --accent:#86A9EE; --accent-ink:#0E131A; --accent-soft:#1C2940;
    --pass:#53C48F; --pass-soft:#12301F; --fail:#F07D71; --fail-soft:#3A1B18;
    --warn:#E6B154; --warn-soft:#33280F; --na:#A3ACB9; --na-soft:#222A36;
    --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E131A; --sheet:#161D27; --ink:#E5EAF1; --muted:#9AA5B5; --faint:#6E7887;
  --line:#273141; --line-strong:#384457;
  --accent:#86A9EE; --accent-ink:#0E131A; --accent-soft:#1C2940;
  --pass:#53C48F; --pass-soft:#12301F; --fail:#F07D71; --fail-soft:#3A1B18;
  --warn:#E6B154; --warn-soft:#33280F; --na:#A3ACB9; --na-soft:#222A36;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:0 48px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1360px;margin:0 auto}

/* top bar */
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:18px 14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand h1{font-size:17px;font-weight:600;margin:0;line-height:1.25}
.brand p{margin:0;font-size:12.5px;color:var(--muted)}
.app-ver{font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 7px;margin-left:4px;vertical-align:2px}
.ref-chip{font-family:var(--f-mono);font-size:12px;color:var(--muted);border:1px solid var(--line-strong);border-radius:999px;padding:3px 10px;white-space:nowrap}
.top-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:var(--r-sm);padding:8px 14px;border:1px solid var(--line-strong);background:var(--sheet);cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.55;cursor:progress}
.btn svg{width:16px;height:16px;flex:none}
.btn.danger-arm{border-color:var(--fail);color:var(--fail);background:var(--fail-soft)}

/* layout */
.layout{display:grid;grid-template-columns:272px minmax(0,1fr);gap:18px;align-items:start}

/* sidebar */
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;max-height:calc(100vh - 24px);overflow:hidden}
.side-head{padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.side-head h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
.search{position:relative}
.search input{width:100%;border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:7px 10px 7px 32px;background:var(--paper)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--faint)}
.doc-list{overflow:auto;padding:6px 8px 12px;flex:1}
.grp{font-size:11.5px;color:var(--faint);font-weight:600;letter-spacing:.04em;padding:12px 8px 4px}
.doc{display:grid;grid-template-columns:52px minmax(0,1fr) 8px;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;border-radius:6px;padding:6px 8px;cursor:pointer;font-size:13.5px;line-height:1.3}
.doc:hover{background:var(--paper)}
.doc .code{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.doc .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc .dot{width:7px;height:7px;border-radius:50%}
.doc .dot.p{background:var(--warn)} .doc .dot.ok{background:var(--pass)} .doc .dot.bad{background:var(--fail)}
.doc[aria-current="true"]{background:var(--accent-soft)}
.doc[aria-current="true"] .code,.doc[aria-current="true"] .nm{color:var(--accent);font-weight:600}
.empty-search{padding:16px 8px;color:var(--muted);font-size:13px}

/* cards */
.main{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.info{padding:18px 20px 20px}
.doc-title{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.code-badge{font-family:var(--f-mono);font-size:15px;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:6px 11px}
.doc-title h2{font-size:20px;margin:0;font-weight:600;line-height:1.3;text-wrap:balance}
.doc-title .grp-lbl{font-size:13px;color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px 16px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label,.f .lbl{font-size:12.5px;color:var(--muted);font-weight:500}
.f input,.f select{width:100%;border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:8px 10px;background:var(--sheet);min-height:40px}
.f input:hover,.f select:hover{border-color:var(--faint)}
.f input.mono{font-family:var(--f-mono);font-size:13.5px}
.s6{grid-column:span 6} .s3{grid-column:span 3} .s2{grid-column:span 2} .s4{grid-column:span 4}
.hint{font-size:12px;color:var(--faint);min-height:18px}
.hint.ok{color:var(--pass)} .hint.bad{color:var(--fail)}
.out{min-height:40px;border:1px dashed var(--line-strong);border-radius:var(--r-sm);padding:7px 10px;display:flex;align-items:center;font-weight:600;font-variant-numeric:tabular-nums}

/* summary */
.summary{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:5;padding:12px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px}
.prog{flex:1 1 220px;min-width:0}
.prog-top{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px}
.prog-top b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--na-soft);overflow:hidden;display:flex}
.bar span{display:block;height:100%;transition:width .25s}
.bar .y{background:var(--pass)} .bar .n{background:var(--fail)} .bar .a{background:var(--na)}
.counts{display:flex;gap:16px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.counts b{font-variant-numeric:tabular-nums;color:var(--ink);font-size:15px;margin-left:4px}
.counts .k::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:1px}
.k.y::before{background:var(--pass)} .k.n::before{background:var(--fail)} .k.a::before{background:var(--na)}
.errtot{display:flex;align-items:baseline;gap:6px;font-size:13px;color:var(--muted)}
.errtot b{font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-weight:600;font-size:13.5px;white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.pend{background:var(--warn-soft);color:var(--warn)}
.pill.pass{background:var(--pass-soft);color:var(--pass)}
.pill.fail{background:var(--fail-soft);color:var(--fail)}

/* checklist */
.colhead{display:grid;grid-template-columns:3rem minmax(0,1fr) 13.5rem minmax(9rem,14rem) 5.5rem;gap:12px;padding:0 18px;font-size:12px;color:var(--faint);font-weight:600;letter-spacing:.03em}
.colhead span:nth-child(3),.colhead span:nth-child(5){text-align:center}
.sec{overflow:hidden}
.sec-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:12px 18px;background:color-mix(in srgb,var(--accent-soft) 45%,var(--sheet));border-bottom:1px solid var(--line)}
.sec-t{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}
.sec-n{font-family:var(--f-mono);font-size:13px;color:var(--accent);min-width:1.4rem}
.sec-t h3{font-size:15.5px;margin:0;font-weight:600}
.ref{font-size:12px;color:var(--faint)}
.sec-tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sec-prog{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-right:4px}
.sec-prog.done{color:var(--pass);font-weight:600}
.ghost{border:1px solid transparent;background:none;color:var(--accent);border-radius:6px;padding:4px 9px;font-size:12.5px;cursor:pointer;font-weight:500}
.ghost:hover{border-color:var(--line-strong);background:var(--sheet)}
.row{display:grid;grid-template-columns:3rem minmax(0,1fr) 13.5rem minmax(9rem,14rem) 5.5rem;grid-template-areas:"num txt seg note err";gap:12px;align-items:center;padding:10px 18px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .num{grid-area:num;font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.row .txt{grid-area:txt;min-width:0;font-size:14.5px}
.row .seg{grid-area:seg}
.row .note{grid-area:note}
.row .errbox{grid-area:err}
